<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <style>
        body {
            background: linear-gradient(to right, #060a1f, #141b5d); 
            height: 100vh;
            margin: 0;
        }

        .container-wrapper {
            display: flex;
            justify-content: left;
            margin-left: 2em;
            align-items: center;
            height: 100vh;
        }

        .id-card {
            background-color: #d9d9d9;
            width: 550px;  
            min-height: 320px; 
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
        }

        .picture-box {
            width: 150px; 
            height: 150px; 
            background-color: #000c5d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
        }

        .info {
            text-align: left;
            flex: 1;
            padding-left: 20px;
        }

        .info p {
            margin: 5px 0; 
        }

        
        .title-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            position: absolute;
            
            left: 20px;
        }

        .title-bar img {
            max-width: 80px;
        }

    </style>
</head>
<body>

     <!-- Title Bar -->
     <div class="title-bar">
        <img src="logo.png" alt="Nano Scan Logo" class="img-fluid">
        <h1 class="text-white">Nano Scan</h1>
    </div>

    <!-- Id Card -->
    <div class="container-wrapper">    
        <div class="id-card">
            <h5 id="school" class="text-center">Phinma University of Iloilo</h5>
            
            <div class="content">
                <img src="default-avatar.jpg" alt="profile pic"  class="picture-box">

                <div class="info">
                    <p id="name" class="fw-bold fs-5">Bonnie Boy F. Franco III</p>
                    <p id="id-no" class="fw-semibold fs-6">ID NO. 04-23-24-032584</p>
                    <p id="program" class="fs-6">BS Information Technology</p>
                    <p id="section" class="fs-6">FC1-BSIT2-4</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div class="modal fade" id="admin-login-modal" tabindex="-1" aria-labelledby="admin-login-label" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="background: #1e1e1e; color: #e0e0e0; border-radius: 12px;">
                <div class="modal-header">
                    <h5 class="modal-title" id="admin-login-label">Admin Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-start">
                    <form method="post" action="/admin-login">
                        <div class="mb-3">
                            <label for="admin-username" class="form-label">Username</label>
                            <input type="text" name="admin-username" id="admin-username" class="form-control" placeholder="Enter username" required>
                        </div>
                        <div class="mb-3">
                            <label for="admin-password" class="form-label">Password</label>
                            <input type="password" id="admin-password" name="admin-password" class="form-control" placeholder="Enter password" required>
                        </div>
                        <!-- Submit Button Inside Form -->
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">Login</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
