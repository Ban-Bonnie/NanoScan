<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 CSS (Load First) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>Nano Scan</title>
</head>
<body>
    <div class="container">
        <h1>Nano Scan</h1>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#admin-login-modal">
            Admin Login
        </button>
        <button onclick="fetchUser()">Scan Now</button>
        
        
        <div id="data-container">
            <h2>Student Information</h2>
            <div id="data" class="user-data">Scan to display user details.</div>
        </div>

    </div>

  

    <!-- Modal -->
    <div class="modal fade" id="admin-login-modal" tabindex="-1" aria-labelledby="admin-login-label" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="background: #1e1e1e; color: #e0e0e0; border-radius: 12px;">
                <div class="modal-header">
                    <h5 class="modal-title" id="admin-login-label">Admin Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-start">
                    <form method="post" action="/admin-login">
                        <div class="mb-3">
                            <label for="admin-username" class="form-label">Username</label>
                            <input type="text" name="admin-username" id="admin-username" class="form-control" placeholder="Enter username" required>
                        </div>
                        <div class="mb-3">
                            <label for="admin-password" class="form-label">Password</label>
                            <input type="password" id="admin-password" name="admin-password" class="form-control" placeholder="Enter password" required>
                        </div>
                        <!-- Submit Button Inside Form -->
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">Login</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>



    <script src="{{ url_for('static', filename='js/script.js')}}"></script>
</body>
</html>
