<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoScan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    

</head>
<body>
     <!-- Title Bar -->
     <div class="title-bar">
        <img src="{{url_for('static', filename='img/logo.png')}}" alt="Nano Scan Logo" class="img-fluid">
        <h1 class="text-gradient">Nano Scan <span class="admin-gradient">ADMIN</span></h1>
    </div>    

    <!-- Id Card -->
    <div class="container-wrapper">    
        <div id="card-content" class="id-card-default">
            <h2 onclick="fetchrfid()" >Hello Admin!</h2>
        </div>
        <!-- Buttons -->
        <div class="buttons-and-navigation rounded-3">
            <button onclick="fetchrfid()" id="register-student-btn">Register Student</button>
            <button id="openStudentsModal-btn" data-bs-toggle="modal" data-bs-target="#studentsModal">Students</button>
            <form method="post" action="/admin-logout">
                <button id="logout-btn">Log Out</button>
            </form>
        </div>
    </div>



    <!-- Students Modal -->
    <div class="modal fade" id="studentsModal" tabindex="-1" aria-labelledby="studentsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl"> <!-- Changed to modal-xl for more space -->
            <div class="modal-content p-3"> <!-- Added padding for better spacing -->
                <div class="modal-header">
                    <h5 class="modal-title" id="studentsModalLabel">Students List</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    
                    <!-- Search and Filter -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <input type="text" id="searchStudent" class="form-control form-control-lg" placeholder="🔍 Search student...">
                        </div>
                        <div class="col-md-4">
                            <select id="filterProgram" class="form-select form-select-lg">
                                <option value="">📚 All Programs</option>
                                <option value="BS Information Technology">BS Information Technology</option>
                                <option value="BS Computer Science">BS Computer Science</option>
                            </select>
                        </div>
                    </div>

                    <!-- Students Table -->
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover text-center">
                            <thead class="table-dark">
                                <tr>
                                    <th style="width: 10%;">Student ID</th>
                                    <th style="width: 18%;">Name</th>
                                    <th style="width: 12%;">Phone</th>
                                    <th style="width: 12%;">Parent Phone</th>
                                    <th style="width: 12%;">Tag No.</th>
                                    <th style="width: 15%;">Program</th>
                                    <th style="width: 10%;">Section</th>
                                    <th style="width: 11%;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentsTable">
                                <!-- Example Rows -->
                                 {% for student in students %}
                                <tr>
                                    <td>{{students[7]}}</td>
                                    <td>{{students[2], students[1]}}</td>
                                    <td>{{students[4]}}</td>
                                    <td>{{students[3]}}</td>
                                    <td>{{students[5]}}</td>
                                    <td>{{students[7]}}</td>
                                    <td>{{students[6]}}</td>
                                    <td>
                                        <a href="#" class="btn text-warning fs-5"><i class="bi bi-pencil-square"></i></a>
                                        <a href="#" class="btn text-danger fs-5"><i class="bi bi-trash"></i></a>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>

    
    <!-- Register RFID Modal -->
    <div class="modal fade" id="register-rfid" tabindex="-1" aria-labelledby="register-rfid-label" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="background: #1e1e1e; color: #e0e0e0; border-radius: 12px;">
                <div class="modal-header">
                    <h5 class="modal-title" id="register-rfid-label">Register RFID</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-start">
                    <form method="post" action="/admin-register-rfid">
                        <div class="mb-3">
                            <label for="student_id" class="form-label">Student ID</label>
                            <input type="text" name="student_id" id="student_id" class="form-control" placeholder="Enter student ID" required>
                        </div>
                        <div class="mb-3">
                            <label for="firstname" class="form-label">First Name</label>
                            <input type="text" name="firstname" id="firstname" class="form-control" placeholder="Enter first name" required>
                        </div>
                        <div class="mb-3">
                            <label for="lastname" class="form-label">Last Name</label>
                            <input type="text" name="lastname" id="lastname" class="form-control" placeholder="Enter last name" required>
                        </div>
                        <div class="mb-3">
                            <label for="parent_phone" class="form-label">Parent's Phone</label>
                            <input type="text" name="parent_phone" id="parent_phone" class="form-control" placeholder="Enter parent's phone number" required>
                        </div>
                        <div class="mb-3">
                            <label for="student_phone" class="form-label">Student's Phone</label>
                            <input type="text" name="student_phone" id="student_phone" class="form-control" placeholder="Enter student's phone number" required>
                        </div>
                        <div class="mb-3">
                            <label for="program" class="form-label">Program</label>
                            <select name="program" id="program" class="form-control" required>
                                <option value="BS Information Technology">BS Information Technology</option>
                            </select>
                        </div> 
                        <div class="mb-3">
                            <label for="section" class="form-label">Section</label>
                            <select name="section" id="section" class="form-control" required>
                                <option value="FC1-BSIT2-4">FC1-BSIT2-4</option>
                            </select>
                        </div>                            
                        <input type="hidden" name="tag_no" id="tag_no"> <!-- Hidden tag_no field -->
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">Register Student</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script src="{{url_for('static',filename='js/admin-script.js')}}"></script>
</body>

</html>
